name: Device report
description: Tell us how Leap works with your strap, watch or ring
labels: [device report]
body:
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "Amazfit Helio Strap / Galaxy Watch 7 / Oura Ring 4 ..."
    validations: { required: true }
  - type: dropdown
    id: path
    attributes:
      label: How does the data reach Leap?
      options: [Gadgetbridge, Health Connect, Other]
    validations: { required: true }
  - type: checkboxes
    id: works
    attributes:
      label: What shows up in Leap?
      options:
        - label: Heart rate / strain
        - label: Resting heart rate
        - label: HRV / recovery
        - label: Sleep and stages
        - label: Breathing rate
        - label: Blood oxygen
        - label: Live heart rate
        - label: Workouts
  - type: textarea
    id: notes
    attributes:
      label: Anything odd?
      description: Missing data, numbers that look off, setup tips for others.
